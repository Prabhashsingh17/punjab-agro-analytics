services:
  - type: web
    name: punjab-agro-analytics
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python src/generate_data.py
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
